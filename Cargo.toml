[package]
name = "sistema_bancarario_hnl"
version = "0.1.0"
edition = "2024"

[dependencies]
# El framework web
axum = {version = "0.8.6", features = ["macros"] }

# El runtime asíncrono
tokio = { version = "1.48.0", features = ["full"] }

# Serialización y Deserialización (para JSON)
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"

# SQLx para PostgreSQL
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "postgres", "uuid", "chrono","macros"] }

# Cliente no oficial de TigerBeetle
# Correcto (sin metadata)
tigerbeetle-unofficial = "0.14.12"
tigerbeetle-unofficial-sys = "0.14.12"
# Encriptacion
json-web-token = "0.2.0"
bcrypt = "0.17.1"

# logs
tower-http = { version = "0.6.6", features = ["trace"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "json"] }

# Para manejar IDs únicos
uuid = { version = "1.18.1", features = ["v4", "serde"] }

# Para manejar variables de entorno (.env)
dotenvy = "0.15.7"
chrono = { version = "0.4.42", features = ["serde"] }
validator = { version = "0.20.0", features = ["derive"] }
jsonwebtoken = {version = "10.1.0",features = ["rust_crypto"]}
anyhow = "1.0.100"
reqwest={version = "0.12.24", features = ["json"]}
async-trait = "0.1.89"
[[bin]]
name = "main"
path = "src/main.rs"